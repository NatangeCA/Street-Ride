<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Street-Ride install check</title>
<style>body{font:16px system-ui;background:#1f0e09;color:#f3e6df;padding:16px;max-width:640px;margin:auto}
.r{padding:8px 10px;margin:6px 0;border-radius:8px;background:#3a1c13;word-break:break-all}.ok{border-left:6px solid #4caf50}.bad{border-left:6px solid #e53935}.w{border-left:6px solid #ffb300}</style></head><body>
<h2>Street-Ride install check</h2><div id="o">Checking…</div>
<script>
const o=document.getElementById('o');let h='';
const add=(c,t)=>{h+='<div class="r '+c+'">'+t+'</div>';o.innerHTML=h;};
(async()=>{
 add('w','Page: '+location.href);
 if(!location.pathname.endsWith('/')&&!/\.html$/.test(location.pathname))add('bad','Address has no trailing slash or file name');
 const mu=new URL('manifest.webmanifest',location.href).href;
 let m=null;
 try{const r=await fetch(mu,{cache:'no-store'});
  if(!r.ok)add('bad','manifest.webmanifest → HTTP '+r.status+' (missing or in wrong folder)');
  else{const t=await r.text();try{m=JSON.parse(t);add('ok','manifest.webmanifest loads and is valid JSON');}catch(e){add('bad','manifest is not valid JSON: '+e.message);}}
 }catch(e){add('bad','manifest fetch failed: '+e.message);}
 if(m){
  add('w','display: '+m.display+' · start_url: '+m.start_url+' · scope: '+m.scope);
  for(const i of (m.icons||[])){
   const u=new URL(i.src,mu).href;
   try{const r=await fetch(u,{cache:'no-store'});
    if(!r.ok){add('bad',i.src+' → HTTP '+r.status+' — this file is not where the manifest says');continue;}
    const b=await r.blob();const url=URL.createObjectURL(b);
    const im=new Image();await new Promise(s=>{im.onload=s;im.onerror=s;im.src=url;});
    const sz=im.naturalWidth+'x'+im.naturalHeight;
    add(im.naturalWidth?(sz===i.sizes?'ok':'bad'):'bad',i.src+' → '+r.status+', '+b.type+', '+b.size+' bytes, real size '+sz+' (manifest says '+i.sizes+')');
   }catch(e){add('bad',i.src+' failed: '+e.message);}
  }
 }
 try{const r=await fetch(new URL('sw.js',location.href).href,{cache:'no-store'});add(r.ok?'ok':'bad','sw.js → HTTP '+r.status);}catch(e){add('bad','sw.js failed');}
 try{const r=await fetch(new URL('index.html',location.href).href,{cache:'no-store'});const t=await r.text();
  const v=(t.match(/APP_VER='([^']+)'/)||[])[1];const l=(t.match(/rel="manifest" href="([^"]+)"/)||[])[1];
  add(r.ok?'ok':'bad','index.html → HTTP '+r.status+', version '+v+', manifest link: '+l);}catch(e){add('bad','index.html failed');}
 try{const rs=await navigator.serviceWorker.getRegistrations();add('w','Service workers registered: '+rs.length+(rs.length?' ('+rs.map(x=>x.scope).join(', ')+')':''));}catch(e){}
 add('w','Standalone now: '+(matchMedia('(display-mode: standalone)').matches?'yes (already installed)':'no'));
 add('w','Send me a screenshot of this page.');
})();
</script></body></html>
